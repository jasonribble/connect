[package]
name = "nbd"
version = "0.1.0"
edition = "2021"


[package.metadata]
authors = ["Jason Ribble <git@j6r.org>"]

[dependencies]
anyhow = "1.0.86"
async-trait = "0.1.80"
chrono = { version = "0.4.38", features = ["serde"] }
clap = { version = "4.5.9", features = ["derive"] }
csv = "1.3.1"
dirs = "6.0.0"
dotenvy = "0.15.0"
regex = "1.5.4"
serde = "1.0.219"
sqlx = { version = "0.9.0", features = [
  "runtime-tokio",
  "tls-native-tls",
  "sqlite",
  "chrono",
] }
tabled = "0.21.0"
tokio = { version = "1.28.0", features = ["full"] }

[dev-dependencies]
mockall = "0.15.0"
assert_cmd = "2.1.2"
predicates = "3.1"
tempfile = "3.19.1"

[[bin]]
name = "nbd-cli"
path = "src/cli/main.rs"

[lib]
name = "nbd"
path = "src/lib.rs"

[lints.rust]
unsafe_code = "forbid"

# come at me, clippy
[lints.clippy]
pedantic = { level = "deny", priority = -1 }
# DEVELOPING LINTS
nursery = { level = "deny", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
indexing_slicing = "deny"
arithmetic_side_effects = "deny"
unreachable = "deny"
unimplemented = "deny"
unchecked_time_subtraction = "deny"
todo = "deny"
string_slice = "deny"
panic_in_result_fn = "deny"
panic = "deny"
exit = "deny"
as_conversions = "deny"
